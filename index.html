<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>MP3 Trimmer</title><style>*{box-sizing:border-box}body{background:#10151e;color:#f2f5fa;font:17px -apple-system,system-ui;margin:0;padding: max(24px,env(safe-area-inset-top)) 20px 40px}main{max-width:600px;margin:auto}h1{font-size:32px;margin-bottom:5px}p,small{color:#aab7ca}section{background:#1c2533;border-radius:18px;padding:18px;margin:18px 0}button,.pick{display:block;width:100%;background:#82e0bb;color:#10251d;border:0;border-radius:12px;padding:15px;font:600 17px system-ui;text-align:center;margin:10px 0}button:disabled{opacity:.4}input[type=range]{width:100%;accent-color:#82e0bb}input[type=number]{width:100%;background:#10151e;color:white;border:1px solid #526176;border-radius:8px;padding:10px;font-size:17px}canvas{width:100%;height:120px}label{display:block;margin-top:12px}audio{width:100%}#file{display:none}#status{overflow-wrap:anywhere} .times{display:flex;gap:14px}.times>label{flex:1;min-width:0}</style></head><body><main><h1>MP3 Trimmer</h1><p>Private audio editing · on your device</p><label class="pick" for="file">Choose MP3 file</label><input id="file" type="file" accept=".mp3,audio/mpeg"><p id="status" role="status">Choose a file to begin.</p><section id="editor" hidden><canvas id="wave" width="900" height="240" aria-label="Audio waveform"></canvas><div class="times"><label>Start (seconds)<input id="start" type="number" min="0" step="0.01"></label><label>End (seconds)<input id="end" type="number" min="0" step="0.01"></label></div><label>Start<input id="sr" type="range" min="0" step="0.01"></label><label>End<input id="er" type="range" min="0" step="0.01"></label><p id="length"></p><button id="preview">Preview selection</button><audio id="audio" controls preload="metadata"></audio><button id="save">Export trimmed MP3</button><small>Lossless frame-based trimming. Cuts may shift slightly; a brief artifact at the start is possible. Original file stays unchanged.</small></section><small id="offline">Checking offline support…</small></main><script>
const $=id=>document.getElementById(id);let bytes,frames=[],duration=0,peaks=[],name='',url,previewEnd=null;const audio=$('audio');
function scan(b){let p=0,t=0,out=[];if(b[0]===73&&b[1]===68&&b[2]===51)p=10+((b[6]&127)<<21)+((b[7]&127)<<14)+((b[8]&127)<<7)+(b[9]&127);while(p+4<=b.length){let a=b[p+1],c=b[p+2],v=(a>>3)&3,l=(a>>1)&3,bi=c>>4,si=(c>>2)&3;if(b[p]!==255||(a&224)!==224||v===1||l!==1||!bi||bi===15||si===3){p++;continue}let rate=[44100,48000,32000][si]/(v===3?1:v===2?2:4),br=(v===3?[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320]:[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160])[bi],n=Math.floor((v===3?144000:72000)*br/rate)+((c>>1)&1),dt=(v===3?1152:576)/rate;if(p+n>b.length)break;let side=p+4+((a&1)?0:2),mono=(b[p+3]>>6)===3,meta=side+(v===3?(mono?17:32):(mono?9:17)),tag=String.fromCharCode(...b.slice(meta,meta+4)),vbri=String.fromCharCode(...b.slice(p+36,p+40));if(!(out.length===0&&(tag==='Xing'||tag==='Info'||vbri==='VBRI'))){out.push({p,n,t,dt});t+=dt}p+=n}return {out,t}}
function draw(){let c=$('wave'),x=c.getContext('2d'),w=c.width,h=c.height,s=+$('start').value,e=+$('end').value;x.fillStyle='#10151e';x.fillRect(0,0,w,h);x.fillStyle='#23483f';x.fillRect(s/duration*w,0,(e-s)/duration*w,h);for(let i=0;i<peaks.length;i++){x.fillStyle=i/peaks.length*duration>=s&&i/peaks.length*duration<=e?'#82e0bb':'#526176';let a=peaks[i]*h*.46;x.fillRect(i*w/peaks.length,h/2-a,Math.max(1,w/peaks.length-1),Math.max(2,a*2))}}
function sync(which){let s=Math.max(0,Math.min(duration,Number($('start').value)||0)),e=Math.max(0,Math.min(duration,Number($('end').value)||0));if(s>e){if(which==='start')s=e;else e=s}$('start').value=s.toFixed(2);$('end').value=e.toFixed(2);$('sr').value=s;$('er').value=e;$('length').textContent='Selected: '+(e-s).toFixed(2)+' seconds';$('save').disabled=$('preview').disabled=e<=s;draw()}
$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;$('editor').hidden=true;$('status').textContent='Reading audio…';audio.pause();previewEnd=null;try{bytes=new Uint8Array(await f.arrayBuffer());let r=scan(bytes);frames=r.out;duration=r.t;if(frames.length<2)throw Error('Unsupported or invalid MP3 file.');name=f.name.replace(/\.mp3$/i,'');if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);audio.src=url;peaks=[];for(let id of ['start','end','sr','er'])$(id).max=duration;$('start').value=0;$('end').value=duration;$('editor').hidden=false;sync();$('status').textContent=f.name+' · '+duration.toFixed(2)+' seconds';try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let d=await ctx.decodeAudioData(bytes.buffer.slice(0)),a=d.getChannelData(0),n=450;peaks=Array.from({length:n},(_,i)=>{let m=0;for(let j=Math.floor(i*a.length/n);j<Math.floor((i+1)*a.length/n);j+=Math.max(1,Math.floor(a.length/n/200)))m=Math.max(m,Math.abs(a[j]));return m});await ctx.close();draw()}catch{ $('status').textContent+=' · Waveform unavailable; trimming still works.'}}catch(e){$('status').textContent=e.message}};
for(let id of ['start','end'])$(id).onchange=()=>sync(id);for(let [r,n] of [['sr','start'],['er','end']])$(r).oninput=()=>{$(n).value=$(r).value;sync(n)};$('preview').onclick=async()=>{try{audio.currentTime=+$('start').value;previewEnd=+$('end').value;await audio.play()}catch(e){$('status').textContent='Preview unavailable: '+e.message}};audio.ontimeupdate=()=>{if(previewEnd!==null&&audio.currentTime>=previewEnd){audio.pause();previewEnd=null}};
$('save').onclick=async()=>{let s=+$('start').value,e=+$('end').value,selected=frames.filter(f=>f.t+f.dt>s&&f.t<e);if(!selected.length)return;let blob=new Blob(selected.map(f=>bytes.subarray(f.p,f.p+f.n)),{type:'audio/mpeg'}),file=new File([blob],name+'-trimmed.mp3',{type:'audio/mpeg'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(err){if(err.name==='AbortError')return}let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)};
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('offline').textContent='Offline files cached. Test in Airplane Mode after installing.'}).catch(()=>{$('offline').textContent='Offline setup failed. Open via HTTPS.'})}else $('offline').textContent='Offline caching unavailable in this browser.';
</script></body></html>
